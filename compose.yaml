services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rebootx
      POSTGRES_PASSWORD: local-dev-only
      POSTGRES_DB: rebootx
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rebootx -d rebootx"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
